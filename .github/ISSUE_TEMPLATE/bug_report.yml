name: Bug report
description: Something in the provider isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Remove API keys, passwords, and other secrets from everything you paste below.
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: "1.9.5"
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Utho provider version
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: resources
    attributes:
      label: Affected resources or data sources
      placeholder: "utho_cloud, utho_vpc"
  - type: textarea
    id: config
    attributes:
      label: Terraform configuration
      description: The smallest configuration that reproduces the problem.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error output from `terraform plan` or `terraform apply`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. terraform apply
        2. ...
